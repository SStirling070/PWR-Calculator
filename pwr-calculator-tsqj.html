const { useState, useMemo } = React;


// ── BMW CCA Club Racing — PWR Class Calculator ────────────────────────────────
// Mirrors the official 2026 PWR Disclosure Jotform logic:
//   PM = (mean of 7 sampled WHP + mean of 7 sampled Torque) / 2
//   7 points, 500 RPM apart, top = nearest 500 below the electronic rev limit
//   Mustang dyno → PM × 1.10 ; Declared PM must be ≥ Calculated PM
//   Ratio = (Weight / PM) + (Aero + Tires + Trans) → PWR band
// Build solver inverts the math: weight window per class (at a PM) and
//   PM window per class (at a weight), so you can plan build direction.
// ──────────────────────────────────────────────────────────────────────────────

const mono = { fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" };
const sans = { fontFamily: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" };

const T = {
  paper: "#EDF1F3", panel: "#FFFFFF", line: "#CFD7DC",
  ink: "#16242C", mut: "#5C6B73", accent: "#0A5AA6",
  pass: "#1E7A46", fail: "#C0392B", warn: "#B26A00",
};

const BANDS = [
  { name: "PWR5", floor: 6,  ceil: 9,  hue: "#C0392B" },
  { name: "PWR4", floor: 9,  ceil: 11, hue: "#E07B39" },
  { name: "PWR3", floor: 11, ceil: 14, hue: "#C9A227" },
  { name: "PWR2", floor: 14, ceil: 17, hue: "#3E8E7E" },
  { name: "PWR1", floor: 17, ceil: 999, hue: "#2E6DA4" },
];
const BAND_MIN = 6, BAND_MAX = 20;
const UNB = (b) => b.ceil >= 999;

function classify(ratio) {
  if (!isFinite(ratio)) return null;
  if (ratio < 6) return { name: "—", note: "Above PWR5 power density — no class. Add weight or reduce PM.", floor: null, ceil: null, hue: "#7a1f16" };
  for (const b of BANDS) if (ratio >= b.floor && ratio < b.ceil) return b;
  return BANDS[BANDS.length - 1];
}

// solver: weight range to sit in [floor,ceil) at a given PM + mods
function weightWindow(pm, mods, b) {
  return [pm * (b.floor - mods), UNB(b) ? Infinity : pm * (b.ceil - mods)];
}
// solver: PM range to sit in [floor,ceil) at a given weight + mods (higher PM → lower ratio)
function pmWindow(w, mods, b) {
  return [UNB(b) ? 0 : w / (b.ceil - mods), w / (b.floor - mods)];
}
// gap solver: min weight change to reach target class b (holding PM+mods)
function weightToClass(pm, mods, w, b) {
  const [lo, hi] = weightWindow(pm, mods, b);
  if (w < lo) return { dir: "add", amt: lo - w, edge: lo, bound: "floor" };
  if (w >= hi) return { dir: "remove", amt: w - hi, edge: hi, bound: "ceiling" };
  return { dir: "in", amt: 0 };
}
// gap solver: min PM change to reach target class b (holding weight+mods)
function pmToClass(w, mods, pm, b) {
  const [pmMin, pmMax] = pmWindow(w, mods, b);
  if (pm > pmMax) return { dir: "reduce", amt: pm - pmMax, edge: pmMax, bound: "max" };
  if (pm <= pmMin) return { dir: "addpwr", amt: pmMin - pm, edge: pmMin, bound: "min" };
  return { dir: "in", amt: 0 };
}

const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : NaN; };
const r1 = (x) => Math.round(x * 10) / 10;
const r2 = (x) => Math.round(x * 100) / 100;
const lbs = (x) => (isFinite(x) ? Math.round(x).toLocaleString() : "—");

function modStr(v) {
  if (v === 0) return "0";
  const s = v > 0 ? "+" : "-"; const a = Math.abs(v);
  return s + (a === 0.5 ? ".5" : String(a));
}

const TIRE_OPTS = [

];

// Sample dyno presets: S52 build ladder (baseline → M50 manifold → Stage 2 → Stage 3),

    redline: "7000",
    mustang: "yes",
    rows: [
      { hp: "219.92", tq: "165.00" }, // 7000

    rows: [
      { hp: "230", tq: "175" }, // 7000
      { hp: "237", tq: "184" }, // 6500
      { hp: "230", tq: "200" }, // 6000
      { hp: "220", tq: "215" }, // 5500
      { hp: "195", tq: "215" }, // 5000

    ],

  s54: {

    rows: [
      { hp: "327.79", tq: "215.21" }, // 8000
      { hp: "329.20", tq: "230.62" }, // 7500
      { hp: "326.60", tq: "245.03" }, // 7000
      { hp: "313.16", tq: "253.23" }, // 6500
      { hp: "297.47", tq: "260.40" }, // 6000
      { hp: "278.94", tq: "266.62" }, // 5500
      { hp: "258.09", tq: "271.10" }, // 5000
    ],
  },
  s65: {
    label: "S65",
    note: "Traced from Dynojet chart · peak 367.8 whp @ 8250 · rev limit 8400 → top sample 8000",
    redline: "8400",
    rows: [
      { hp: "365.58", tq: "240.00" }, // 8000
      { hp: "357.01", tq: "250.00" }, // 7500
      { hp: "346.53", tq: "260.00" }, // 7000
      { hp: "320.09", tq: "258.63" }, // 6500
      { hp: "303.31", tq: "265.50" }, // 6000
      { hp: "284.84", tq: "272.00" }, // 5500
      { hp: "263.04", tq: "276.30" }, // 5000
    ],
  },
};

// ── UI atoms ──────────────────────────────────────────────────────────────────
function Field({ label, children, hint }) {
  return (
    <label style={{ display: "block", marginBottom: 12 }}>
      <div style={{ ...sans, fontSize: 11, letterSpacing: ".04em", textTransform: "uppercase", color: T.mut, marginBottom: 5 }}>{label}</div>
      {children}
      {hint && <div style={{ ...sans, fontSize: 11, color: T.mut, marginTop: 4 }}>{hint}</div>}
    </label>
  );
}
const inputCls = "w-full px-3 py-2 rounded border outline-none focus:border-blue-600 transition-colors";
const inputSty = { ...mono, background: "#F7F9FA", borderColor: T.line, color: T.ink, fontSize: 15 };
function NumIn({ value, onChange, placeholder, step }) {
  return <input type="number" step={step || "any"} value={value} placeholder={placeholder}
    onChange={(e) => onChange(e.target.value)} className={inputCls} style={inputSty} />;
}
function Seg({ options, value, onChange }) {
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
      {options.map((o) => {
        const on = value === o.key;
        return (
          <button key={o.key} onClick={() => onChange(o.key)}
            style={{ ...sans, fontSize: 12.5, padding: "7px 11px", borderRadius: 6, cursor: "pointer",
              border: `1px solid ${on ? T.accent : T.line}`, background: on ? T.accent : "#F7F9FA",
              color: on ? "#fff" : T.ink, fontWeight: on ? 600 : 400 }}>
            {o.label}
          </button>
        );
      })}
    </div>
  );
}
function Stat({ label, value, unit, big, color }) {
  return (
    <div style={{ flex: 1, minWidth: 108 }}>
      <div style={{ ...sans, fontSize: 10.5, letterSpacing: ".05em", textTransform: "uppercase", color: T.mut }}>{label}</div>
      <div style={{ ...mono, fontSize: big ? 30 : 20, fontWeight: 600, color: color || T.ink, lineHeight: 1.15 }}>
        {value}{unit && <span style={{ fontSize: big ? 14 : 11, color: T.mut, marginLeft: 4 }}>{unit}</span>}
      </div>
    </div>
  );
}
function Card({ n, title, sub, right, children }) {
  return (
    <section style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 10, padding: 20, marginBottom: 18 }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 10, marginBottom: 16, borderBottom: `1px solid ${T.line}`, paddingBottom: 12 }}>
        <span style={{ ...mono, fontSize: 12, fontWeight: 700, color: "#fff", background: T.ink, borderRadius: 4, padding: "2px 7px", marginTop: 1 }}>{n}</span>
        <div style={{ flex: 1 }}>
          <h2 style={{ ...sans, fontSize: 16, fontWeight: 700, color: T.ink, margin: 0 }}>{title}</h2>
          {sub && <div style={{ ...sans, fontSize: 12, color: T.mut, marginTop: 2 }}>{sub}</div>}
        </div>
        {right}
      </div>
      {children}
    </section>
  );
}

function ClassBand({ ratio }) {
  const pos = isFinite(ratio) ? Math.max(0, Math.min(1, (ratio - BAND_MIN) / (BAND_MAX - BAND_MIN))) : null;
  return (
    <div style={{ margin: "6px 0 4px" }}>
      <div style={{ position: "relative", height: 40, borderRadius: 6, overflow: "hidden", border: `1px solid ${T.line}`, display: "flex" }}>
        {BANDS.map((b) => {
          const lo = Math.max(b.floor, BAND_MIN), hi = Math.min(b.ceil, BAND_MAX);
          const w = ((hi - lo) / (BAND_MAX - BAND_MIN)) * 100;
          return (
            <div key={b.name} style={{ width: `${w}%`, background: b.hue, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <span style={{ ...mono, fontSize: 11, fontWeight: 700, color: "#fff", opacity: .95 }}>{b.name}</span>
            </div>
          );
        })}
      </div>
      <div style={{ position: "relative", height: 16 }}>
        {[6, 9, 11, 14, 17, 20].map((v) => {
          const left = ((v - BAND_MIN) / (BAND_MAX - BAND_MIN)) * 100;
          return <span key={v} style={{ ...mono, position: "absolute", left: `${left}%`, transform: "translateX(-50%)", fontSize: 10, color: T.mut }}>{v === 20 ? "17+" : v}</span>;
        })}
      </div>
      {pos !== null && (
        <div style={{ position: "relative", height: 0 }}>
          <div style={{ position: "absolute", top: -74, left: `${pos * 100}%`, transform: "translateX(-50%)",
            width: 0, height: 0, borderLeft: "7px solid transparent", borderRight: "7px solid transparent", borderTop: `9px solid ${T.ink}` }} />
        </div>
      )}
    </div>
  );
}

// windows table (weight-per-class or PM-per-class)
function WindowTable({ head, rows, currentName }) {
  return (
    <div style={{ border: `1px solid ${T.line}`, borderRadius: 8, overflow: "hidden" }}>
      <div style={{ display: "grid", gridTemplateColumns: "62px 1fr 1fr", background: "#F2F5F7", borderBottom: `1px solid ${T.line}` }}>
        {head.map((h) => <div key={h} style={{ ...sans, fontSize: 10.5, fontWeight: 700, color: T.mut, textTransform: "uppercase", letterSpacing: ".04em", padding: "7px 10px" }}>{h}</div>)}
      </div>
      {rows.map((r, i) => {
        const on = r.name === currentName;
        return (
          <div key={r.name} style={{ display: "grid", gridTemplateColumns: "62px 1fr 1fr", alignItems: "center",
            borderBottom: i < rows.length - 1 ? `1px solid ${T.line}` : "none",
            background: on ? `${r.hue}18` : "transparent", borderLeft: `3px solid ${on ? r.hue : "transparent"}` }}>
            <div style={{ ...mono, fontSize: 12.5, fontWeight: 700, color: r.hue, padding: "7px 10px" }}>{r.name}</div>
            <div style={{ ...mono, fontSize: 13, color: T.ink, padding: "7px 10px" }}>{r.lo}</div>
            <div style={{ ...mono, fontSize: 13, color: T.ink, padding: "7px 10px" }}>{r.hi}</div>
          </div>
        );
      })}
    </div>
  );
}

// adjustment tile: how much weight / PM to change to reach target class
function GapTile({ kind, gap, band, pm, w, mods }) {
  const hue = band.hue;
  let big, sub, tone = T.ink;
  if (!gap) { big = "—"; sub = ""; }
  else if (gap.dir === "in") {
    tone = T.pass;
    big = "In class ✓";
    if (kind === "weight") {
      const [wlo] = weightWindow(pm, mods, band);   // class-min (floor) weight
      const room = w - wlo;
      sub = room > 0.5 ? `Drop up to ${lbs(room)} lb → ${lbs(wlo)} lb, the ${band.name} floor` : `At the ${band.name} floor — no weight to spare`;
    } else {
      const [, pmHi] = pmWindow(w, mods, band);      // class-min (floor) = max PM
      const room = pmHi - pm;
      sub = room > 0.05 ? `Gain up to ${r1(room)} PM → ${r1(pmHi)} PM, the ${band.name} cap` : `At the ${band.name} power cap — no room to gain`;
    }
  }
  else if (kind === "weight") {
    const add = gap.dir === "add";
    big = `${add ? "+" : "−"}${lbs(gap.amt)} lb`;
    sub = `${add ? "Add ballast" : "Remove weight"} → ${lbs(gap.edge)} lb (${band.name} ${gap.bound})`;
    tone = add ? T.accent : T.warn;
  } else {
    const add = gap.dir === "addpwr";
    big = `${add ? "+" : "−"}${r1(gap.amt)} PM`;
    sub = `${add ? "Add power" : "Detune"} → ${r1(gap.edge)} PM (${band.name} ${gap.bound})`;
    tone = add ? T.accent : T.warn;
  }
  return (
    <div style={{ flex: "1 1 220px", background: "#F7F9FA", border: `1px solid ${T.line}`, borderLeft: `3px solid ${hue}`, borderRadius: 8, padding: "13px 15px" }}>
      <div style={{ ...sans, fontSize: 10.5, letterSpacing: ".05em", textTransform: "uppercase", color: T.mut, marginBottom: 3 }}>{kind === "weight" ? "Weight change" : "Power change (PM)"}</div>
      <div style={{ ...mono, fontSize: 24, fontWeight: 700, color: tone, lineHeight: 1.2 }}>{big}</div>
      {sub && <div style={{ ...sans, fontSize: 12, color: T.mut, marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

// ── main ──────────────────────────────────────────────────────────────────────
function PWRCalculator() {
  const [redline, setRedline] = useState("");
  const [topOverride, setTopOverride] = useState("");
  const [rows, setRows] = useState(Array.from({ length: 7 }, () => ({ hp: "", tq: "" })));
  const [mustang, setMustang] = useState("no");
  const [preset, setPreset] = useState("");
  const [declaredPM, setDeclaredPM] = useState("");

  const [usePMFromDyno, setUsePMFromDyno] = useState(true);
  const [manualPM, setManualPM] = useState("");
  const [weight, setWeight] = useState("");
  const [tire, setTire] = useState("dotr");
  const [aero, setAero] = useState("no");
  const [trans, setTrans] = useState("manual");
  const [targetClass, setTargetClass] = useState("PWR3");

  const [impW, setImpW] = useState("");
  const [impPM, setImpPM] = useState("");

  // PM chain
  const rl = num(redline);
  const autoTop = isFinite(rl) ? Math.floor(rl / 500) * 500 : NaN;
  const top = topOverride !== "" ? num(topOverride) : autoTop;
  const rpmPoints = useMemo(() => Array.from({ length: 7 }, (_, i) => (isFinite(top) ? top - i * 500 : NaN)), [top]);
  const hpVals = rows.map((r) => num(r.hp)).filter(isFinite);
  const tqVals = rows.map((r) => num(r.tq)).filter(isFinite);
  const avgHP = hpVals.length === 7 ? hpVals.reduce((a, b) => a + b, 0) / 7 : NaN;
  const avgTQ = tqVals.length === 7 ? tqVals.reduce((a, b) => a + b, 0) / 7 : NaN;
  const calcPMraw = isFinite(avgHP) && isFinite(avgTQ) ? (avgHP + avgTQ) / 2 : NaN;
  const calcPM = isFinite(calcPMraw) ? (mustang === "yes" ? calcPMraw * 1.1 : calcPMraw) : NaN;
  const dPM = num(declaredPM);
  const pmBelow = isFinite(dPM) && isFinite(calcPM) && dPM < calcPM;
  const setRow = (i, k, v) => setRows((rs) => rs.map((r, j) => (j === i ? { ...r, [k]: v } : r)));

  const loadPreset = (key) => {
    setPreset(key);
    if (!key) return;
    const p = DYNO_PRESETS[key];
    setTopOverride(""); setMustang(p.mustang || "no"); setRedline(p.redline);
    setRows(p.rows.map((r) => ({ ...r })));
  };
  const clearDyno = () => { setPreset(""); setRedline(""); setTopOverride(""); setRows(Array.from({ length: 7 }, () => ({ hp: "", tq: "" }))); setDeclaredPM(""); };

  // modifiers + class
  const tireMod = TIRE_OPTS.find((t) => t.key === tire).val;
  const aeroMod = aero === "yes" ? -0.5 : 0;
  const transMod = trans === "other" ? -0.5 : 0;
  const totalMod = tireMod + aeroMod + transMod;

  // effective PM: declared if present, else fall back to calculated (planning convenience)
  const pmForClass = usePMFromDyno ? (isFinite(dPM) ? dPM : calcPM) : num(manualPM);
  const pmIsFallback = usePMFromDyno && !isFinite(dPM) && isFinite(calcPM);
  const w = num(weight);
  const baseRatio = isFinite(w) && isFinite(pmForClass) && pmForClass > 0 ? w / pmForClass : NaN;
  const finalRatio = isFinite(baseRatio) ? baseRatio + totalMod : NaN;
  const cls = classify(finalRatio);
  const watt = `${isFinite(w) ? Math.round(w) : "----"}  ${modStr(aeroMod)}  ${modStr(tireMod)}  ${modStr(transMod)}`;

  // solver rows
  const havePM = isFinite(pmForClass) && pmForClass > 0;
  const haveW = isFinite(w) && w > 0;
  const wRows = BANDS.map((b) => {
    const [lo, hi] = weightWindow(pmForClass, totalMod, b);
    return { name: b.name, hue: b.hue, lo: havePM ? lbs(lo) : "—", hi: havePM ? (UNB(b) ? "no limit" : lbs(hi)) : "—" };
  });
  const pRows = BANDS.map((b) => {
    const [lo, hi] = pmWindow(w, totalMod, b);
    return { name: b.name, hue: b.hue, lo: haveW ? (UNB(b) ? "any low" : r1(lo)) : "—", hi: haveW ? r1(hi) : "—" };
  });

  // current-class stay-in ranges
  let stay = null;
  if (cls && cls.floor && havePM && haveW) {
    const [wlo, whi] = weightWindow(pmForClass, totalMod, cls);
    const [plo, phi] = pmWindow(w, totalMod, cls);
    stay = {
      cls: cls.name, hue: cls.hue,
      wlo: lbs(wlo), whi: UNB(cls) ? "no limit" : lbs(whi),
      plo: UNB(cls) ? "any low" : r1(plo), phi: r1(phi),
    };
  }

  // gap to a chosen target class
  const targetBand = BANDS.find((b) => b.name === targetClass);
  const wGap = havePM && haveW && targetBand ? weightToClass(pmForClass, totalMod, w, targetBand) : null;
  const pGap = havePM && haveW && targetBand ? pmToClass(w, totalMod, pmForClass, targetBand) : null;

  // impound
  const iW = num(impW), iPM = num(impPM);
  const impRatioRaw = isFinite(iW) && isFinite(iPM) && iPM > 0 ? iW / iPM + totalMod : NaN;
  const impRatio = isFinite(impRatioRaw) ? r1(impRatioRaw) : NaN;
  const declFloor = cls && cls.floor ? cls.floor : null;
  const impPass = isFinite(impRatio) && declFloor !== null ? impRatio >= declFloor : null;

  return (
    <div style={{ ...sans, background: T.paper, minHeight: "100vh", padding: "24px 16px", color: T.ink }}>
      <div style={{ maxWidth: 760, margin: "0 auto" }}>

        <header style={{ marginBottom: 20 }}>
          <div style={{ ...mono, fontSize: 11, letterSpacing: ".14em", color: T.accent, textTransform: "uppercase" }}>BMW CCA Club Racing · 2026</div>
          <h1 style={{ ...sans, fontSize: 26, fontWeight: 800, margin: "3px 0 4px", letterSpacing: "-.01em" }}>PWR Class Calculator</h1>
          <p style={{ fontSize: 13, color: T.mut, margin: 0 }}>
            Dyno → Power Metric → class, a build solver for weight/PM windows, and an impound check. Logic mirrors the official PWR Disclosure Jotform.
          </p>
        </header>

        {/* ── §1 PM ─────────────────────────────────────────────── */}
        <Card n="1" title="Power Metric from dyno" sub="Highest-HP run · 7 points · 500 RPM apart, top = nearest 500 below the rev limit"
          right={
            <div style={{ display: "flex", gap: 6 }}>
              <select value={preset} onChange={(e) => loadPreset(e.target.value)}
                style={{ ...sans, fontSize: 12, fontWeight: 600, padding: "6px 9px", borderRadius: 6, cursor: "pointer",
                  border: `1px solid ${preset ? T.accent : T.line}`, background: preset ? "#EAF1F8" : "#F7F9FA", color: preset ? T.accent : T.ink }}>
                <option value="">Sample dyno…</option>
                {Object.entries(DYNO_PRESETS).map(([k, p]) => <option key={k} value={k}>{p.label}</option>)}
              </select>
              <button onClick={clearDyno} style={{ ...sans, fontSize: 11.5, padding: "6px 10px", borderRadius: 6, cursor: "pointer", border: `1px solid ${T.line}`, background: "#F7F9FA", color: T.mut }}>Clear</button>
            </div>
          }>
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 150px" }}>
              <Field label="Electronic rev limit (RPM)" hint={isFinite(autoTop) ? `Top sample point → ${autoTop}` : "e.g. 6800"}>
                <NumIn value={redline} onChange={setRedline} placeholder="6800" />
              </Field>
            </div>
            <div style={{ flex: "1 1 150px" }}>
              <Field label="Top point override" hint="Optional — leave blank to auto-use nearest 500">
                <NumIn value={topOverride} onChange={setTopOverride} placeholder={isFinite(autoTop) ? String(autoTop) : "auto"} />
              </Field>
            </div>
          </div>

          <div style={{ border: `1px solid ${T.line}`, borderRadius: 8, overflow: "hidden", marginTop: 4 }}>
            <div style={{ display: "grid", gridTemplateColumns: "64px 1fr 1fr", background: "#F2F5F7", borderBottom: `1px solid ${T.line}` }}>
              {["RPM", "WHP", "Torque"].map((h) => (
                <div key={h} style={{ ...sans, fontSize: 11, fontWeight: 700, color: T.mut, textTransform: "uppercase", letterSpacing: ".04em", padding: "8px 10px" }}>{h}</div>
              ))}
            </div>
            {rows.map((r, i) => (
              <div key={i} style={{ display: "grid", gridTemplateColumns: "64px 1fr 1fr", borderBottom: i < 6 ? `1px solid ${T.line}` : "none", alignItems: "center" }}>
                <div style={{ ...mono, fontSize: 13, color: isFinite(rpmPoints[i]) ? T.ink : T.mut, padding: "6px 10px", background: "#FAFBFC" }}>
                  {isFinite(rpmPoints[i]) ? rpmPoints[i] : "—"}
                </div>
                <div style={{ padding: 5 }}><input type="number" value={r.hp} onChange={(e) => setRow(i, "hp", e.target.value)} placeholder="hp"
                  className="w-full px-2 py-1 rounded outline-none focus:bg-white" style={{ ...mono, fontSize: 14, background: "transparent", border: "1px solid transparent", color: T.ink }} /></div>
                <div style={{ padding: 5 }}><input type="number" value={r.tq} onChange={(e) => setRow(i, "tq", e.target.value)} placeholder="lb-ft"
                  className="w-full px-2 py-1 rounded outline-none focus:bg-white" style={{ ...mono, fontSize: 14, background: "transparent", border: "1px solid transparent", color: T.ink }} /></div>
              </div>
            ))}
          </div>

          {preset && (
            <div style={{ ...sans, fontSize: 11.5, color: T.mut, marginTop: 8, paddingLeft: 2 }}>
              <b style={{ color: T.accent }}>{DYNO_PRESETS[preset].label}</b> — {DYNO_PRESETS[preset].note}. Sample data, not car #949.
            </div>
          )}

          <div style={{ marginTop: 14 }}>
            <Field label="Mustang dyno? (adds 10% to PM)">
              <Seg options={[{ key: "no", label: "Dynojet / other" }, { key: "yes", label: "Mustang ×1.10" }]} value={mustang} onChange={setMustang} />
            </Field>
          </div>

          <div style={{ display: "flex", gap: 18, flexWrap: "wrap", background: "#F2F5F7", borderRadius: 8, padding: "14px 16px", marginTop: 6 }}>
            <Stat label="Avg WHP" value={isFinite(avgHP) ? r1(avgHP) : "—"} />
            <Stat label="Avg torque" value={isFinite(avgTQ) ? r1(avgTQ) : "—"} />
            <Stat label="Calculated PM" value={isFinite(calcPM) ? r1(calcPM) : "—"} big color={T.accent} />
          </div>

          <div style={{ marginTop: 14 }}>
            <Field label="Declared PM" hint="Declare ≥ Calculated PM; a touch higher covers dyno-to-dyno variation.">
              <NumIn value={declaredPM} onChange={setDeclaredPM} placeholder={isFinite(calcPM) ? String(r1(calcPM)) : "PM"} />
            </Field>
            {pmBelow && (
              <div style={{ ...sans, fontSize: 12.5, color: T.fail, fontWeight: 600, marginTop: -6 }}>
                Declared PM ({r1(dPM)}) is below Calculated PM ({r1(calcPM)}) — the Jotform will reject this.
              </div>
            )}
          </div>
        </Card>

        {/* ── §2 Classifier ─────────────────────────────────────── */}
        <Card n="2" title="Classifier" sub="(Weight ÷ PM) + Aero + Tires + Transmission → PWR class">
          <Field label="PM source">
            <Seg options={[{ key: "dyno", label: "Use PM from §1" }, { key: "manual", label: "Enter PM manually" }]}
              value={usePMFromDyno ? "dyno" : "manual"} onChange={(k) => setUsePMFromDyno(k === "dyno")} />
          </Field>
          {pmIsFallback && <div style={{ ...sans, fontSize: 11.5, color: T.warn, marginTop: -6, marginBottom: 10 }}>Using Calculated PM {r1(calcPM)} until you enter a Declared PM in §1.</div>}

          <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
            {!usePMFromDyno && (
              <div style={{ flex: "1 1 140px" }}>
                <Field label="Power Metric (PM)"><NumIn value={manualPM} onChange={setManualPM} placeholder="210" /></Field>
              </div>
            )}
            <div style={{ flex: "1 1 140px" }}>
              <Field label="Declared weight (lbs)" hint="w/ driver + safety gear + remaining fuel">
                <NumIn value={weight} onChange={setWeight} placeholder="2730" />
              </Field>
            </div>
          </div>

          <Field label="Tires"><Seg options={TIRE_OPTS.map((t) => ({ key: t.key, label: t.label }))} value={tire} onChange={setTire} /></Field>
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 200px" }}>
              <Field label="Aero (wing / splitter / diffuser …)">
                <Seg options={[{ key: "no", label: "None" }, { key: "yes", label: "Aero −0.5" }]} value={aero} onChange={setAero} />
              </Field>
            </div>
            <div style={{ flex: "1 1 200px" }}>
              <Field label="Transmission">
                <Seg options={[{ key: "manual", label: "H-pattern manual" }, { key: "other", label: "Other −0.5" }]} value={trans} onChange={setTrans} />
              </Field>
            </div>
          </div>

          <div style={{ background: "#F2F5F7", borderRadius: 8, padding: "16px", marginTop: 4 }}>
            <div style={{ display: "flex", gap: 18, flexWrap: "wrap", marginBottom: 18 }}>
              <Stat label="Base ratio (W÷PM)" value={isFinite(baseRatio) ? r2(baseRatio) : "—"} />
              <Stat label="Modifiers" value={(totalMod >= 0 ? "+" : "") + totalMod} />
              <Stat label="PWR ratio" value={isFinite(finalRatio) ? r2(finalRatio) : "—"} big />
              <Stat label="Class" value={cls ? cls.name : "—"} big color={cls ? cls.hue : T.ink} />
            </div>
            <ClassBand ratio={finalRatio} />
            {cls && cls.note && <div style={{ ...sans, fontSize: 12.5, color: T.warn, fontWeight: 600, marginTop: 26 }}>{cls.note}</div>}
            <div style={{ ...mono, fontSize: 13, color: T.ink, marginTop: 18, paddingTop: 12, borderTop: `1px solid ${T.line}` }}>
              <span style={{ ...sans, fontSize: 11, textTransform: "uppercase", letterSpacing: ".05em", color: T.mut, marginRight: 8 }}>WATT display</span>{watt}
            </div>
          </div>
        </Card>

        {/* ── §3 Build solver ───────────────────────────────────── */}
        <Card n="3" title="Build solver" sub="Invert the math: what weight / PM lands you in each class. Uses PM, weight, and modifiers from §1–2.">
          {stay ? (
            <div style={{ borderRadius: 8, padding: "14px 16px", marginBottom: 16, background: `${stay.hue}14`, border: `1px solid ${stay.hue}55` }}>
              <div style={{ ...sans, fontSize: 12, color: T.mut, marginBottom: 4 }}>To stay <b style={{ color: stay.hue }}>{stay.cls}</b> at your current modifiers ({(totalMod >= 0 ? "+" : "") + totalMod}):</div>
              <div style={{ ...mono, fontSize: 14, color: T.ink, lineHeight: 1.7 }}>
                weight <b>{stay.wlo} – {stay.whi}</b> lb&nbsp; (at PM {r1(pmForClass)})<br />
                PM <b>{stay.plo} – {stay.phi}</b>&nbsp; (at {lbs(w)} lb)
              </div>
            </div>
          ) : (
            <div style={{ ...sans, fontSize: 12.5, color: T.mut, marginBottom: 16 }}>Enter a PM (§1 or §2) and a weight (§2) to see stay-in-class ranges. Tables below fill as soon as one side is known.</div>
          )}

          <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 300px" }}>
              <div style={{ ...sans, fontSize: 12, fontWeight: 700, color: T.ink, marginBottom: 6 }}>Weight window per class <span style={{ color: T.mut, fontWeight: 400 }}>· at PM {havePM ? r1(pmForClass) : "—"}</span></div>
              <WindowTable head={["Class", "Min lb", "Max lb"]} rows={wRows} currentName={cls ? cls.name : null} />
            </div>
            <div style={{ flex: "1 1 300px" }}>
              <div style={{ ...sans, fontSize: 12, fontWeight: 700, color: T.ink, marginBottom: 6 }}>PM window per class <span style={{ color: T.mut, fontWeight: 400 }}>· at {haveW ? lbs(w) : "—"} lb</span></div>
              <WindowTable head={["Class", "Min PM", "Max PM"]} rows={pRows} currentName={cls ? cls.name : null} />
            </div>
          </div>
          <div style={{ ...sans, fontSize: 11, color: T.mut, marginTop: 10, lineHeight: 1.5 }}>
            Higher PM (more power) or lower weight pushes you toward a faster class (lower number). Boundaries are shared — a car exactly on the line falls in the higher-numbered class. Toggle tires/aero/trans in §2 to see the windows shift.
          </div>

          {/* target-class gap */}
          <div style={{ marginTop: 20, paddingTop: 16, borderTop: `1px solid ${T.line}` }}>
            <div style={{ ...sans, fontSize: 13, fontWeight: 700, color: T.ink, marginBottom: 8 }}>What do I change to run a target class?</div>
            <Field label="Target class">
              <Seg options={BANDS.map((b) => ({ key: b.name, label: b.name }))} value={targetClass} onChange={setTargetClass} />
            </Field>

            {(!havePM || !haveW) ? (
              <div style={{ ...sans, fontSize: 12.5, color: T.mut }}>Enter a PM (§1 or §2) and a weight (§2) to see the adjustment needed.</div>
            ) : (
              <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                <GapTile kind="weight" gap={wGap} band={targetBand} pm={pmForClass} w={w} mods={totalMod} />
                <GapTile kind="pm" gap={pGap} band={targetBand} pm={pmForClass} w={w} mods={totalMod} />
              </div>
            )}
            <div style={{ ...sans, fontSize: 11, color: T.mut, marginTop: 10, lineHeight: 1.5 }}>
              Each tile is a single-variable move to just meet the {targetClass} limit: change weight <i>or</i> change power, holding the other constant.
            </div>
          </div>
        </Card>

        {/* ── §4 Impound ────────────────────────────────────────── */}
        <Card n="4" title="Impound compliance check" sub="Recompute with actual weighed weight + max measured PM; round to nearest tenth">
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 140px" }}><Field label="Impound weight (lbs)"><NumIn value={impW} onChange={setImpW} placeholder="2726" /></Field></div>
            <div style={{ flex: "1 1 140px" }}><Field label="Max impound PM"><NumIn value={impPM} onChange={setImpPM} placeholder="212" /></Field></div>
          </div>
          <div style={{ ...sans, fontSize: 12, color: T.mut, marginBottom: 12 }}>Uses the same modifiers ({(totalMod >= 0 ? "+" : "") + totalMod}) and your declared class floor from §2.</div>

          <div style={{ borderRadius: 8, padding: "16px", background: impPass === null ? "#F2F5F7" : impPass ? "#EAF5EE" : "#FBEBE9", border: `1px solid ${impPass === null ? T.line : impPass ? T.pass : T.fail}` }}>
            <div style={{ display: "flex", gap: 18, flexWrap: "wrap", alignItems: "center" }}>
              <Stat label="Impound ratio (rounded)" value={isFinite(impRatio) ? impRatio.toFixed(1) : "—"} big />
              <Stat label={cls && cls.floor ? `${cls.name} floor` : "Class floor"} value={declFloor !== null ? declFloor.toFixed(1) : "—"} />
              <div style={{ flex: 1, minWidth: 120, textAlign: "right" }}>
                {impPass !== null && <span style={{ ...sans, fontSize: 20, fontWeight: 800, color: impPass ? T.pass : T.fail }}>{impPass ? "✓ PASS" : "✗ DQ"}</span>}
              </div>
            </div>
            {impPass === false && (
              <div style={{ ...sans, fontSize: 12.5, color: T.fail, marginTop: 10 }}>
                Below the {cls.name} minimum — measured PM came in high relative to weight. Add ballast to reach ratio {declFloor.toFixed(1)}.
              </div>
            )}
            {impPass === true && (
              <div style={{ ...sans, fontSize: 12.5, color: T.pass, marginTop: 10 }}>
                Clears the {cls.name} floor with {(impRatio - declFloor).toFixed(1)} to spare.
              </div>
            )}
          </div>
        </Card>

        <footer style={{ ...sans, fontSize: 11.5, color: T.mut, lineHeight: 1.5, marginTop: 4 }}>
          Bands: PWR5 [6–9) · PWR4 [9–11) · PWR3 [11–14) · PWR2 [14–17) · PWR1 [17+]. Modifiers stack; a higher-performance declaration lets you run a lower-performance item without re-classing. Reproduces the published PWR V5.1 math for planning — the approved Jotform disclosure remains the compliance record.
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PWRCalculator/>);
</script></body></html>
