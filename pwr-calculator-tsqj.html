// Mirrors the official 2026 PWR Disclosure Jotform logic:
//   V5.1: PM = (mean of 7 sampled WHP + mean of 7 sampled Torque) / 2
//   V5.2: manual-trans cars unchanged (7 points, 3000 RPM span); Sequential/
//     Automatic-trans cars (-0.5 trans modifier) instead use whichever
//     contiguous 4-of-7 points (1500 RPM span) yields the highest combined
//     WHP+Torque average. Rules committee computes this manually through
//     2026 — this tool's version is a planning estimate.
//   7 points, 500 RPM apart, top = nearest 500 below the electronic rev limit
//   Mustang dyno → PM × 1.10 ; Declared PM must be ≥ Calculated PM
//   Ratio = (Weight / PM) + (Aero + Tires + Trans) → PWR band
// Build solver inverts the math: weight window per class (at a PM) and
//   PM window per class (at a weight), so you can plan build direction.
// A ruleset toggle (V5.1 / V5.2) plus a side-by-side compare panel let a
//   racer see exactly how the 2026 rule change moves their number.
// The dyno chart in §1 renders the 7 WHP/Torque points as draggable markers —
//   drag vertically to re-shape the curve and watch PM/class update live.
// ──────────────────────────────────────────────────────────────────────────────

const BANDS = [
  { name: "PWR5", floor: 6,  ceil: 9,  hue: "#C0392B" },
  { name: "PWR4", floor: 9,  ceil: 11, hue: "#E07B39" },
  { name: "PWR3", floor: 11, ceil: 14, hue: "#C9A227" },

const BAND_MIN = 6, BAND_MAX = 20;
const UNB = (b) => b.ceil >= 999;

function classify(ratio) {
  if (!isFinite(ratio)) return null;
  if (ratio < 6) return { name: "—", note: "Above PWR5 power density — no class. Add weight or reduce PM.", floor: null, ceil: null, hue: "#7a1f16" };
  for (const b of BANDS) if (ratio >= b.floor && ratio < b.ceil) return b;
  return BANDS[BANDS.length - 1];
}

// solver: weight range to sit in [floor,ceil) at a given PM + mods
function weightWindow(pm, mods, b) {
  return [pm * (b.floor - mods), UNB(b) ? Infinity : pm * (b.ceil - mods)];
}
// solver: PM range to sit in [floor,ceil) at a given weight + mods (higher PM → lower ratio)
function pmWindow(w, mods, b) {
  return [UNB(b) ? 0 : w / (b.ceil - mods), w / (b.floor - mods)];
}
// gap solver: min weight change to reach target class b (holding PM+mods)
function weightToClass(pm, mods, w, b) {
  const [lo, hi] = weightWindow(pm, mods, b);
  if (w < lo) return { dir: "add", amt: lo - w, edge: lo, bound: "floor" };
  if (w >= hi) return { dir: "remove", amt: w - hi, edge: hi, bound: "ceiling" };
  return { dir: "in", amt: 0 };
}
// gap solver: min PM change to reach target class b (holding weight+mods)
function pmToClass(w, mods, pm, b) {
  const [pmMin, pmMax] = pmWindow(w, mods, b);
  if (pm > pmMax) return { dir: "reduce", amt: pm - pmMax, edge: pmMax, bound: "max" };
  if (pm <= pmMin) return { dir: "addpwr", amt: pmMin - pm, edge: pmMin, bound: "min" };
  return { dir: "in", amt: 0 };
}

const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : NaN; };
const r1 = (x) => Math.round(x * 10) / 10;
const r2 = (x) => Math.round(x * 100) / 100;
const lbs = (x) => (isFinite(x) ? Math.round(x).toLocaleString() : "—");
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// V5.2: Sequential/Automatic-trans PM uses whichever contiguous 4-of-7 dyno
// points (1500 RPM span) gives the highest combined WHP+Torque average.
// `rows` is top-down (index 0 = highest RPM); returns null if any of the 7
// rows is incomplete (can't yet determine a window).
function best4Window(rows) {
  let best = null;
  for (let s = 0; s <= 3; s++) {
    const slice = rows.slice(s, s + 4);
    const hps = slice.map((r) => num(r.hp));
    const tqs = slice.map((r) => num(r.tq));
    if (hps.some((v) => !isFinite(v)) || tqs.some((v) => !isFinite(v))) continue;
    const avgHP = hps.reduce((a, b) => a + b, 0) / 4;
    const avgTQ = tqs.reduce((a, b) => a + b, 0) / 4;
    const score = avgHP + avgTQ;
    if (!best || score > best.score) best = { startIdx: s, avgHP, avgTQ, score };
  }
  return best;
}

function modStr(v) {
  if (v === 0) return "0";
  const s = v > 0 ? "+" : "-"; const a = Math.abs(v);
  return s + (a === 0.5 ? ".5" : String(a));
}

              color: on ? "#fff" : T.ink, fontWeight: on ? 600 : 400 }}>

          </button>
        );
      })}
    </div>
  );
}
function Stat({ label, value, unit, big, color }) {

function ClassBand({ ratio }) {
  const pos = isFinite(ratio) ? Math.max(0, Math.min(1, (ratio - BAND_MIN) / (BAND_MAX - BAND_MIN))) : null;

        {BANDS.map((b) => {
          const lo = Math.max(b.floor, BAND_MIN), hi = Math.min(b.ceil, BAND_MAX);
          const w = ((hi - lo) / (BAND_MAX - BAND_MIN)) * 100;

            <div key={b.name} style={{ width: `${w}%`, background: b.hue, display: "flex", alignItems: "center", justifyContent: "center" }}>

      {pos !== null && (
        <div style={{ position: "relative", height: 0 }}>
          <div style={{ position: "absolute", top: -74, left: `${pos * 100}%`, transform: "translateX(-50%)",
            width: 0, height: 0, borderLeft: "7px solid transparent", borderRight: "7px solid transparent", borderTop: `9px solid ${T.ink}` }} />

// adjustment tile: how much weight / PM to change to reach target class
function GapTile({ kind, gap, band, pm, w, mods }) {
  const hue = band.hue;
  let big, sub, tone = T.ink;
  if (!gap) { big = "—"; sub = ""; }
  else if (gap.dir === "in") {
    tone = T.pass;
    big = "In class ✓";
    if (kind === "weight") {
      const [wlo] = weightWindow(pm, mods, band);   // class-min (floor) weight
      const room = w - wlo;
      sub = room > 0.5 ? `Drop up to ${lbs(room)} lb → ${lbs(wlo)} lb, the ${band.name} floor` : `At the ${band.name} floor — no weight to spare`;
    } else {
      const [, pmHi] = pmWindow(w, mods, band);      // class-min (floor) = max PM
      const room = pmHi - pm;
      sub = room > 0.05 ? `Gain up to ${r1(room)} PM → ${r1(pmHi)} PM, the ${band.name} cap` : `At the ${band.name} power cap — no room to gain`;
    }
  }
  else if (kind === "weight") {
    const add = gap.dir === "add";
    big = `${add ? "+" : "−"}${lbs(gap.amt)} lb`;
    sub = `${add ? "Add ballast" : "Remove weight"} → ${lbs(gap.edge)} lb (${band.name} ${gap.bound})`;
    tone = add ? T.accent : T.warn;
  } else {
    const add = gap.dir === "addpwr";
    big = `${add ? "+" : "−"}${r1(gap.amt)} PM`;
    sub = `${add ? "Add power" : "Detune"} → ${r1(gap.edge)} PM (${band.name} ${gap.bound})`;
    tone = add ? T.accent : T.warn;
  }
  return (
    <div style={{ flex: "1 1 220px", background: "#F7F9FA", border: `1px solid ${T.line}`, borderLeft: `3px solid ${hue}`, borderRadius: 8, padding: "13px 15px" }}>
      <div style={{ ...sans, fontSize: 10.5, letterSpacing: ".05em", textTransform: "uppercase", color: T.mut, marginBottom: 3 }}>{kind === "weight" ? "Weight change" : "Power change (PM)"}</div>
      <div style={{ ...mono, fontSize: 24, fontWeight: 700, color: tone, lineHeight: 1.2 }}>{big}</div>
      {sub && <div style={{ ...sans, fontSize: 12, color: T.mut, marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

// Interactive dyno chart: shows the full width of the pull (2500 RPM up to
// just past the rev limiter, per the dyno-documentation rule that pulls must
// start no higher than 2500 RPM), drawn on a shared numeric Y axis for WHP
// and Torque. The bold, draggable trace covers only the 7 official PWR
// sample points. `refCurve` (when the active preset has one) is the real
// source pull's full curve, drawn as a faint line underneath for context —
// it is not editable and not part of the PM calc, so it visibly diverges
// from the bold trace once a marker is dragged. With no refCurve, the chart
// is left blank outside the 7 points rather than inventing data.
// `scopeRange` shades the RPM band actually in scope for the active PM calc.
// Each 500-RPM sample point is a draggable marker on both curves; dragging
// vertically live-edits that row's hp/tq value — the chart and the §1 table
// stay two-way bound.
function DynoChart({ rpmPoints, rows, setRow, scopeRange, xMin, xMax, refCurve, width, height }) {
  const PAD = { l: 44, r: 14, t: 14, b: 26 };
  const innerW = width - PAD.l - PAD.r;
  const innerH = height - PAD.t - PAD.b;
  const n = rpmPoints.length;

  // chart position k runs 0..n-1 left (low RPM) → right (high RPM); origIdx
  // is the matching index into `rows`/`rpmPoints` (top-down, 0 = highest RPM)
  const origIdx = (k) => n - 1 - k;
  const rpmAt = (k) => rpmPoints[origIdx(k)];
  const hpAt = (k) => { const v = num(rows[origIdx(k)].hp); return isFinite(v) ? v : 100; };
  const tqAt = (k) => { const v = num(rows[origIdx(k)].tq); return isFinite(v) ? v : 150; };

  // the full reference curve (when the active preset has one) can peak higher
  // than the 7 official points — e.g. S54's true peak (332 @ 7800) sits
  // outside its 3000 RPM PWR window — so the Y scale has to account for it too
  const refInDomain = (refCurve || []).filter((p) => p.rpm >= xMin && p.rpm <= xMax);
  const yMaxData = Math.max(
    50,
    ...Array.from({ length: n }, (_, k) => hpAt(k)),
    ...Array.from({ length: n }, (_, k) => tqAt(k)),
    ...refInDomain.map((p) => num(p.hp)).filter(isFinite),
    ...refInDomain.map((p) => num(p.tq)).filter(isFinite)
  );
  const yMax = Math.ceil((yMaxData * 1.15) / 50) * 50;

  // x is true RPM-proportional across [xMin, xMax] — the whole pull width —
  // not just evenly spaced across the 7 known points
  const xAt = (rpm) => PAD.l + ((rpm - xMin) / (xMax - xMin)) * innerW;
  const yAt = (v) => PAD.t + innerH - (clamp(v, 0, yMax) / yMax) * innerH;

  const [drag, setDrag] = useState(null); // { origIdx, field, startY, startVal }

  // relative/delta dragging (not absolute pointer-position mapping): the
  // value moves by how far the pointer has traveled since mousedown, damped
  // by DRAG_SENSITIVITY. Absolute mapping snapped the value straight to
  // wherever the pointer landed, which made a trackpad's small click-jitter
  // (common on clickpads) read as the value "exploding" on first contact.
  const DRAG_SENSITIVITY = 0.6;
  const startValOf = (oi, field) => {
    const v = num(rows[oi][field]);
    return isFinite(v) ? v : (field === "hp" ? 100 : 150);
  };
  const onMarkerDown = (e, oi, field) => {
    e.preventDefault();
    if (e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId);
    setDrag({ origIdx: oi, field, startY: e.clientY, startVal: startValOf(oi, field) });
  };
  const onSvgMove = (e) => {
    if (!drag) return;
    const perPixel = yMax / innerH;
    const deltaY = e.clientY - drag.startY;
    const val = clamp(Math.round((drag.startVal - deltaY * perPixel * DRAG_SENSITIVITY) * 10) / 10, 0, 999);
    setRow(drag.origIdx, drag.field, String(val));
  };
  const endDrag = () => setDrag(null);

  // trace only covers the 7 known sample points (bottom..top) — intentionally
  // left blank outside that span, since that's the only data we have
  const hpPath = Array.from({ length: n }, (_, k) => `${k === 0 ? "M" : "L"}${xAt(rpmAt(k))},${yAt(hpAt(k))}`).join(" ");
  const tqPath = Array.from({ length: n }, (_, k) => `${k === 0 ? "M" : "L"}${xAt(rpmAt(k))},${yAt(tqAt(k))}`).join(" ");
  const yTicks = [0, 0.25, 0.5, 0.75, 1].map((f) => Math.round(yMax * f));
  const xTicks = [];
  for (let v = Math.ceil(xMin / 500) * 500; v <= xMax; v += 500) xTicks.push(v);

  const scopeX0 = xAt(scopeRange[0]) - 10, scopeX1 = xAt(scopeRange[1]) + 10;

  // reference curve: real source data beyond the 7 official points, shown as
  // muted context underneath the bold interactive trace — not draggable, and
  // not part of the PM calc. Only drawn where the preset actually has points.
  const refHpPath = refInDomain.length > 1
    ? refInDomain.map((p, i) => `${i === 0 ? "M" : "L"}${xAt(p.rpm)},${yAt(num(p.hp))}`).join(" ")
    : "";
  const refTqPath = refInDomain.length > 1
    ? refInDomain.map((p, i) => `${i === 0 ? "M" : "L"}${xAt(p.rpm)},${yAt(num(p.tq))}`).join(" ")
    : "";

  return (
    <div style={{ marginTop: 10 }}>
      <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}
        style={{ width: "100%", height: "auto", display: "block", touchAction: "none" }}
        onPointerMove={onSvgMove} onPointerUp={endDrag} onPointerLeave={endDrag}>
        <rect x={scopeX0} y={PAD.t} width={scopeX1 - scopeX0} height={innerH} fill={T.accent} opacity={0.08} />
        {/* y gridlines */}
        {yTicks.map((v) => (
          <g key={v}>
            <line x1={PAD.l} x2={width - PAD.r} y1={yAt(v)} y2={yAt(v)} stroke={T.line} strokeWidth={1} />
            <text x={PAD.l - 6} y={yAt(v) + 3} textAnchor="end" fontSize={9.5} fill={T.mut} style={mono}>{v}</text>
          </g>
        ))}
        {/* x gridlines + RPM labels, every 500 RPM across the whole pull width */}
        {xTicks.map((v) => (
          <g key={v}>
            <line x1={xAt(v)} x2={xAt(v)} y1={PAD.t} y2={height - PAD.b} stroke={T.line} strokeWidth={1} strokeDasharray="2,3" />
            <text x={xAt(v)} y={height - 8} textAnchor="middle" fontSize={9.5} fill={T.mut} style={mono}>{v}</text>
          </g>
        ))}
        {/* reference curve (real data, not editable) drawn first so the bold
            interactive trace sits on top of it — the two coincide until the
            editable points are dragged away from the original pull */}
        {refTqPath && <path d={refTqPath} fill="none" stroke={T.fail} strokeWidth={1.5} opacity={0.3} />}
        {refHpPath && <path d={refHpPath} fill="none" stroke={T.accent} strokeWidth={1.5} opacity={0.3} />}
        {/* traces — the 7 official, draggable PWR sample points */}
        <path d={tqPath} fill="none" stroke={T.fail} strokeWidth={2} />
        <path d={hpPath} fill="none" stroke={T.accent} strokeWidth={2} />
        {/* draggable markers — each is a visible 7px dot plus a larger invisible
            hit-area circle (same pointer handler) so dragging doesn't require
            pixel-perfect precision on the small dot itself */}
        {Array.from({ length: n }, (_, k) => {
          const oi = origIdx(k);
          const x = xAt(rpmAt(k));
          return (
            <g key={`m${k}`}>
              <circle cx={x} cy={yAt(tqAt(k))} r={14} fill="transparent"
                style={{ cursor: "ns-resize" }} onPointerDown={(e) => onMarkerDown(e, oi, "tq")} />
              <circle cx={x} cy={yAt(tqAt(k))} r={7} fill={T.fail} stroke="#fff" strokeWidth={1.5} style={{ pointerEvents: "none" }} />
              <circle cx={x} cy={yAt(hpAt(k))} r={14} fill="transparent"
                style={{ cursor: "ns-resize" }} onPointerDown={(e) => onMarkerDown(e, oi, "hp")} />
              <circle cx={x} cy={yAt(hpAt(k))} r={7} fill={T.accent} stroke="#fff" strokeWidth={1.5} style={{ pointerEvents: "none" }} />
            </g>
          );
        })}
      </svg>
      <div style={{ ...sans, fontSize: 11, color: T.mut, marginTop: 6, display: "flex", gap: 16, alignItems: "center", flexWrap: "wrap" }}>
        <span><span style={{ display: "inline-block", width: 9, height: 9, borderRadius: 9, background: T.accent, marginRight: 5 }} />WHP</span>
        <span><span style={{ display: "inline-block", width: 9, height: 9, borderRadius: 9, background: T.fail, marginRight: 5 }} />Torque</span>
        <span>Drag a marker vertically to edit that point — the §1 table updates live.</span>
      </div>
    </div>
  );
}

// comparison row for the V5.1-vs-V5.2 panel in §2
function CompareRow({ version, active, onPick, pm, ratio, cls }) {
  return (
    <div onClick={onPick} style={{ display: "grid", gridTemplateColumns: "72px 1fr 1fr 1fr", alignItems: "center", cursor: "pointer",
      background: active ? `${T.accent}12` : "transparent", borderLeft: `3px solid ${active ? T.accent : "transparent"}` }}>
      <div style={{ ...mono, fontSize: 12.5, fontWeight: 700, color: active ? T.accent : T.ink, padding: "9px 10px" }}>{version}{active && " ●"}</div>
      <div style={{ ...mono, fontSize: 13, color: T.ink, padding: "9px 10px" }}>{isFinite(pm) ? r1(pm) : "—"}</div>
      <div style={{ ...mono, fontSize: 13, color: T.ink, padding: "9px 10px" }}>{isFinite(ratio) ? r2(ratio) : "—"}</div>
      <div style={{ ...mono, fontSize: 13, fontWeight: 700, color: cls ? cls.hue : T.ink, padding: "9px 10px" }}>{cls ? cls.name : "—"}</div>
    </div>
  );
}

// ── main ──────────────────────────────────────────────────────────────────────
function PWRCalculator() {
  const [redline, setRedline] = useState("");
  const [topOverride, setTopOverride] = useState("");
  const [rows, setRows] = useState(Array.from({ length: 7 }, () => ({ hp: "", tq: "" })));
  const [mustang, setMustang] = useState("no");
  const [preset, setPreset] = useState("");
  const [refCurve, setRefCurve] = useState([]); // full reference curve behind the active preset, if any — chart context only, not editable
  const [declaredPM, setDeclaredPM] = useState("");
  const [trans, setTrans] = useState("manual"); // affects V5.2 PM sampling, so declared ahead of the PM chain
  const [rulesVersion, setRulesVersion] = useState("v52");

  const [usePMFromDyno, setUsePMFromDyno] = useState(true);
  const [manualPM, setManualPM] = useState("");
  const [weight, setWeight] = useState("");
  const [tire, setTire] = useState("dotr");
  const [aero, setAero] = useState("no");
  const [targetClass, setTargetClass] = useState("PWR3");

  const [impW, setImpW] = useState("");
  const [impPM, setImpPM] = useState("");

  // PM chain
  const rl = num(redline);
  const autoTop = isFinite(rl) ? Math.floor(rl / 500) * 500 : NaN;
  const top = topOverride !== "" ? num(topOverride) : autoTop;
  const rpmPoints = useMemo(() => Array.from({ length: 7 }, (_, i) => (isFinite(top) ? top - i * 500 : NaN)), [top]);
  const hpVals = rows.map((r) => num(r.hp)).filter(isFinite);
  const tqVals = rows.map((r) => num(r.tq)).filter(isFinite);
  const avgHP = hpVals.length === 7 ? hpVals.reduce((a, b) => a + b, 0) / 7 : NaN;
  const avgTQ = tqVals.length === 7 ? tqVals.reduce((a, b) => a + b, 0) / 7 : NaN;

  // V5.1: always the flat 7-point average. V5.2: unchanged for manual-trans
  // cars; Sequential/Automatic (-0.5 trans mod) cars instead use whichever
  // contiguous 4-of-7 window maximizes combined WHP+Torque average.
  const calcPM_v51raw = isFinite(avgHP) && isFinite(avgTQ) ? (avgHP + avgTQ) / 2 : NaN;
  const best4 = useMemo(() => best4Window(rows), [rows]);
  const isAltTrans = trans === "other";
  const calcPM_v52raw = isAltTrans
    ? (best4 ? (best4.avgHP + best4.avgTQ) / 2 : NaN)
    : calcPM_v51raw;
  const mustangFactor = mustang === "yes" ? 1.1 : 1;
  const calcPM_v51 = isFinite(calcPM_v51raw) ? calcPM_v51raw * mustangFactor : NaN;
  const calcPM_v52 = isFinite(calcPM_v52raw) ? calcPM_v52raw * mustangFactor : NaN;
  const calcPM = rulesVersion === "v52" ? calcPM_v52 : calcPM_v51; // active ruleset, used throughout below
  // best4 start index is top-down; the window spans startIdx..startIdx+3
  const best4Range = isAltTrans && best4 ? [best4.startIdx, best4.startIdx + 3] : null;
  // the RPM band actually in scope for the active ruleset's PM calc — the full
  // 3000 RPM / 7-point span normally, or the narrower 1500 RPM / 4-point
  // window when V5.2's Sequential/Automatic method picked one
  const scopeRange = (rulesVersion === "v52" && isAltTrans && best4Range)
    ? [rpmPoints[best4Range[1]], rpmPoints[best4Range[0]]]
    : [rpmPoints[6], rpmPoints[0]];
  // chart x-axis spans the whole dyno pull, not just the 7 sample points —
  // down to 2500 RPM (rules require pulls to start no higher than that) and
  // a bit past the rev limiter, so the known 7-point span sits inside a
  // realistic-width chart with blank space either side (no data there)
  const chartXMin = isFinite(rpmPoints[6]) ? Math.min(2500, rpmPoints[6] - 500) : 2500;
  const chartXMax = isFinite(top) ? (isFinite(rl) && rl > top ? rl : top) + 400 : NaN;
  const dPM = num(declaredPM);
  const pmBelow = isFinite(dPM) && isFinite(calcPM) && dPM < calcPM;
  const setRow = (i, k, v) => setRows((rs) => rs.map((r, j) => (j === i ? { ...r, [k]: v } : r)));

  const loadPreset = (key) => {
    setPreset(key);
    if (!key) return;
    const p = DYNO_PRESETS[key];
    setTopOverride(""); setMustang(p.mustang || "no"); setRedline(p.redline);
    setRows(p.rows.map((r) => ({ ...r })));
    setRefCurve(p.curve || []);
  };
  const clearDyno = () => { setPreset(""); setRedline(""); setTopOverride(""); setRows(Array.from({ length: 7 }, () => ({ hp: "", tq: "" }))); setDeclaredPM(""); setRefCurve([]); };

  // modifiers + class
  const tireMod = TIRE_OPTS.find((t) => t.key === tire).val;
  const aeroMod = aero === "yes" ? -0.5 : 0;
  const transMod = trans === "other" ? -0.5 : 0;
  const totalMod = tireMod + aeroMod + transMod;

  // effective PM: declared if present, else fall back to calculated (planning convenience)
  const pmForClass = usePMFromDyno ? (isFinite(dPM) ? dPM : calcPM) : num(manualPM);
  const pmIsFallback = usePMFromDyno && !isFinite(dPM) && isFinite(calcPM);
  const w = num(weight);
  const baseRatio = isFinite(w) && isFinite(pmForClass) && pmForClass > 0 ? w / pmForClass : NaN;
  const finalRatio = isFinite(baseRatio) ? baseRatio + totalMod : NaN;
  const cls = classify(finalRatio);
  const watt = `${isFinite(w) ? Math.round(w) : "----"}  ${modStr(aeroMod)}  ${modStr(tireMod)}  ${modStr(transMod)}`;

  // V5.1-vs-V5.2 comparison: same declared-PM-or-fallback pattern as above,
  // computed for both rulesets' Calculated PM so the delta is visible even
  // before a Declared PM is locked in.
  const pmForClass_v51 = usePMFromDyno ? (isFinite(dPM) ? dPM : calcPM_v51) : num(manualPM);
  const pmForClass_v52 = usePMFromDyno ? (isFinite(dPM) ? dPM : calcPM_v52) : num(manualPM);
  const ratio_v51 = isFinite(w) && isFinite(pmForClass_v51) && pmForClass_v51 > 0 ? w / pmForClass_v51 + totalMod : NaN;
  const ratio_v52 = isFinite(w) && isFinite(pmForClass_v52) && pmForClass_v52 > 0 ? w / pmForClass_v52 + totalMod : NaN;
  const cls_v51 = classify(ratio_v51);
  const cls_v52 = classify(ratio_v52);

  // solver rows
  const havePM = isFinite(pmForClass) && pmForClass > 0;
  const haveW = isFinite(w) && w > 0;
  const wRows = BANDS.map((b) => {
    const [lo, hi] = weightWindow(pmForClass, totalMod, b);
    return { name: b.name, hue: b.hue, lo: havePM ? lbs(lo) : "—", hi: havePM ? (UNB(b) ? "no limit" : lbs(hi)) : "—" };
  });
  const pRows = BANDS.map((b) => {
    const [lo, hi] = pmWindow(w, totalMod, b);
    return { name: b.name, hue: b.hue, lo: haveW ? (UNB(b) ? "any low" : r1(lo)) : "—", hi: haveW ? r1(hi) : "—" };
  });

  // current-class stay-in ranges
  let stay = null;
  if (cls && cls.floor && havePM && haveW) {
    const [wlo, whi] = weightWindow(pmForClass, totalMod, cls);
    const [plo, phi] = pmWindow(w, totalMod, cls);
    stay = {
      cls: cls.name, hue: cls.hue,
      wlo: lbs(wlo), whi: UNB(cls) ? "no limit" : lbs(whi),
      plo: UNB(cls) ? "any low" : r1(plo), phi: r1(phi),
    };
  }

  // gap to a chosen target class
  const targetBand = BANDS.find((b) => b.name === targetClass);
  const wGap = havePM && haveW && targetBand ? weightToClass(pmForClass, totalMod, w, targetBand) : null;
  const pGap = havePM && haveW && targetBand ? pmToClass(w, totalMod, pmForClass, targetBand) : null;

  // impound
  const iW = num(impW), iPM = num(impPM);
  const impRatioRaw = isFinite(iW) && isFinite(iPM) && iPM > 0 ? iW / iPM + totalMod : NaN;
  const impRatio = isFinite(impRatioRaw) ? r1(impRatioRaw) : NaN;
  const declFloor = cls && cls.floor ? cls.floor : null;
  const impPass = isFinite(impRatio) && declFloor !== null ? impRatio >= declFloor : null;

  return (
    <div style={{ ...sans, background: T.paper, minHeight: "100vh", padding: "24px 16px", color: T.ink }}>
      <div style={{ maxWidth: 760, margin: "0 auto" }}>

        <header style={{ marginBottom: 20 }}>
          <div style={{ ...mono, fontSize: 11, letterSpacing: ".14em", color: T.accent, textTransform: "uppercase" }}>BMW CCA Club Racing · 2026</div>
          <h1 style={{ ...sans, fontSize: 26, fontWeight: 800, margin: "3px 0 4px", letterSpacing: "-.01em" }}>PWR Class Calculator</h1>
          <p style={{ fontSize: 13, color: T.mut, margin: 0 }}>
            Dyno → Power Metric → class, a build solver for weight/PM windows, and an impound check. Logic mirrors the official PWR Disclosure Jotform.
          </p>
        </header>

        {/* ── Ruleset toggle ─────────────────────────────────────── */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 14, flexWrap: "wrap",
          background: T.panel, border: `1px solid ${T.line}`, borderRadius: 10, padding: "12px 16px", marginBottom: 18 }}>
          <div>
            <div style={{ ...sans, fontSize: 11, letterSpacing: ".05em", textTransform: "uppercase", color: T.mut }}>Active ruleset</div>
            <div style={{ ...sans, fontSize: 12.5, color: T.mut, marginTop: 2 }}>
              Drives §1–§4 below. The compare panel in §2 always shows both versions side by side.
            </div>
          </div>
          <Seg options={[{ key: "v51", label: "V5.1" }, { key: "v52", label: "V5.2" }]} value={rulesVersion} onChange={setRulesVersion} />
        </div>

        {/* ── §1 PM ─────────────────────────────────────────────── */}
        <Card n="1" title="Power Metric from dyno" sub="Highest-HP run · 7 points · 500 RPM apart, top = nearest 500 below the rev limit"
          right={
            <div style={{ display: "flex", gap: 6 }}>
              <select value={preset} onChange={(e) => loadPreset(e.target.value)}
                style={{ ...sans, fontSize: 12, fontWeight: 600, padding: "6px 9px", borderRadius: 6, cursor: "pointer",
                  border: `1px solid ${preset ? T.accent : T.line}`, background: preset ? "#EAF1F8" : "#F7F9FA", color: preset ? T.accent : T.ink }}>
                <option value="">Sample dyno…</option>
                {Object.entries(DYNO_PRESETS).map(([k, p]) => <option key={k} value={k}>{p.label}</option>)}
              </select>
              <button onClick={clearDyno} style={{ ...sans, fontSize: 11.5, padding: "6px 10px", borderRadius: 6, cursor: "pointer", border: `1px solid ${T.line}`, background: "#F7F9FA", color: T.mut }}>Clear</button>
            </div>
          }>
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 150px" }}>
              <Field label="Electronic rev limit (RPM)" hint={isFinite(autoTop)
                ? `Top sample point → ${autoTop}${rulesVersion === "v52" ? " · V5.2: enter the point just before the curve bends into the limiter cut, not the cut itself" : ""}`
                : "e.g. 6800"}>
                <NumIn value={redline} onChange={setRedline} placeholder="6800" />
              </Field>
            </div>
            <div style={{ flex: "1 1 150px" }}>
              <Field label="Top point override" hint="Optional — leave blank to auto-use nearest 500">
                <NumIn value={topOverride} onChange={setTopOverride} placeholder={isFinite(autoTop) ? String(autoTop) : "auto"} />
              </Field>
            </div>
          </div>

          <div style={{ border: `1px solid ${T.line}`, borderRadius: 8, overflow: "hidden", marginTop: 4 }}>
            <div style={{ display: "grid", gridTemplateColumns: "64px 1fr 1fr", background: "#F2F5F7", borderBottom: `1px solid ${T.line}` }}>
              {["RPM", "WHP", "Torque"].map((h) => (
                <div key={h} style={{ ...sans, fontSize: 11, fontWeight: 700, color: T.mut, textTransform: "uppercase", letterSpacing: ".04em", padding: "8px 10px" }}>{h}</div>
              ))}
            </div>
            {rows.map((r, i) => (
              <div key={i} style={{ display: "grid", gridTemplateColumns: "64px 1fr 1fr", borderBottom: i < 6 ? `1px solid ${T.line}` : "none", alignItems: "center" }}>
                <div style={{ ...mono, fontSize: 13, color: isFinite(rpmPoints[i]) ? T.ink : T.mut, padding: "6px 10px", background: "#FAFBFC" }}>
                  {isFinite(rpmPoints[i]) ? rpmPoints[i] : "—"}
                </div>
                <div style={{ padding: 5 }}><input type="number" value={r.hp} onChange={(e) => setRow(i, "hp", e.target.value)} placeholder="hp"
                  className="w-full px-2 py-1 rounded outline-none focus:bg-white" style={{ ...mono, fontSize: 14, background: "transparent", border: "1px solid transparent", color: T.ink }} /></div>
                <div style={{ padding: 5 }}><input type="number" value={r.tq} onChange={(e) => setRow(i, "tq", e.target.value)} placeholder="lb-ft"
                  className="w-full px-2 py-1 rounded outline-none focus:bg-white" style={{ ...mono, fontSize: 14, background: "transparent", border: "1px solid transparent", color: T.ink }} /></div>
              </div>
            ))}
          </div>

          {preset && (
            <div style={{ ...sans, fontSize: 11.5, color: T.mut, marginTop: 8, paddingLeft: 2 }}>
              <b style={{ color: T.accent }}>{DYNO_PRESETS[preset].label}</b> — {DYNO_PRESETS[preset].note}. Sample data, not car #949.
            </div>
          )}

          {isFinite(top) ? (
            <DynoChart rpmPoints={rpmPoints} rows={rows} setRow={setRow} scopeRange={scopeRange} xMin={chartXMin} xMax={chartXMax} refCurve={refCurve} width={700} height={240} />
          ) : (
            <div style={{ ...sans, fontSize: 12, color: T.mut, marginTop: 10, padding: "14px 16px", background: "#F7F9FA", border: `1px solid ${T.line}`, borderRadius: 8 }}>
              Enter a rev limit above to enable the chart — drag the markers vertically to reshape the WHP/Torque curves; the table above updates live.
            </div>
          )}
          {isFinite(top) && (
            <div style={{ ...sans, fontSize: 11.5, color: T.accent, marginTop: 6 }}>
              {rulesVersion === "v52" && isAltTrans
                ? (best4Range
                    ? `Shaded band = the 4 points (${scopeRange[0]}–${scopeRange[1]} RPM) V5.2 uses for this Sequential/Automatic car — the window with the highest combined WHP+Torque average.`
                    : "Sequential/Automatic V5.2 sampling: fill all 7 points to see which 4-point window gets used.")
                : `Shaded band = the ${scopeRange[0]}–${scopeRange[1]} RPM / 7-point span used for this car's PM. Chart shows the whole pull width (2500 RPM up)${refCurve.length ? " — faint line is the full reference pull outside the official bold/draggable points" : " — blank outside the sampled span, since that's the only data entered"}.`}
            </div>
          )}

          <div style={{ marginTop: 14 }}>
            <Field label="Mustang dyno? (adds 10% to PM)">
              <Seg options={[{ key: "no", label: "Dynojet / other" }, { key: "yes", label: "Mustang ×1.10" }]} value={mustang} onChange={setMustang} />
            </Field>
          </div>

          <div style={{ display: "flex", gap: 18, flexWrap: "wrap", background: "#F2F5F7", borderRadius: 8, padding: "14px 16px", marginTop: 6 }}>
            <Stat label="Avg WHP" value={isFinite(avgHP) ? r1(avgHP) : "—"} />
            <Stat label="Avg torque" value={isFinite(avgTQ) ? r1(avgTQ) : "—"} />
            <Stat label={`Calculated PM (${rulesVersion.toUpperCase()})`} value={isFinite(calcPM) ? r1(calcPM) : "—"} big color={T.accent} />
          </div>
          {rulesVersion === "v52" && isAltTrans && (
            <div style={{ ...sans, fontSize: 11, color: T.mut, marginTop: 6 }}>
              Using the V5.2 Sequential/Automatic method (best 4-of-7 window) — a planning estimate; the rules committee computes this manually through 2026.
            </div>
          )}

          <div style={{ marginTop: 14 }}>
            <Field label="Declared PM" hint="Declare ≥ Calculated PM; a touch higher covers dyno-to-dyno variation.">
              <NumIn value={declaredPM} onChange={setDeclaredPM} placeholder={isFinite(calcPM) ? String(r1(calcPM)) : "PM"} />
            </Field>
            {pmBelow && (
              <div style={{ ...sans, fontSize: 12.5, color: T.fail, fontWeight: 600, marginTop: -6 }}>
                Declared PM ({r1(dPM)}) is below Calculated PM ({r1(calcPM)}) — the Jotform will reject this.
              </div>
            )}
          </div>
        </Card>

        {/* ── §2 Classifier ─────────────────────────────────────── */}
        <Card n="2" title="Classifier" sub="(Weight ÷ PM) + Aero + Tires + Transmission → PWR class">
          <Field label="PM source">
            <Seg options={[{ key: "dyno", label: "Use PM from §1" }, { key: "manual", label: "Enter PM manually" }]}
              value={usePMFromDyno ? "dyno" : "manual"} onChange={(k) => setUsePMFromDyno(k === "dyno")} />
          </Field>
          {pmIsFallback && <div style={{ ...sans, fontSize: 11.5, color: T.warn, marginTop: -6, marginBottom: 10 }}>Using Calculated PM {r1(calcPM)} until you enter a Declared PM in §1.</div>}

          <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
            {!usePMFromDyno && (
              <div style={{ flex: "1 1 140px" }}>
                <Field label="Power Metric (PM)"><NumIn value={manualPM} onChange={setManualPM} placeholder="210" /></Field>
              </div>
            )}
            <div style={{ flex: "1 1 140px" }}>
              <Field label="Declared weight (lbs)" hint="w/ driver + safety gear + remaining fuel">
                <NumIn value={weight} onChange={setWeight} placeholder="2730" />
              </Field>
            </div>
          </div>

          <Field label="Tires"><Seg options={TIRE_OPTS.map((t) => ({ key: t.key, label: t.label }))} value={tire} onChange={setTire} /></Field>
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 200px" }}>
              <Field label="Aero (wing / splitter / diffuser …)">
                <Seg options={[{ key: "no", label: "None" }, { key: "yes", label: "Aero −0.5" }]} value={aero} onChange={setAero} />
              </Field>
            </div>
            <div style={{ flex: "1 1 200px" }}>
              <Field label="Transmission">
                <Seg options={[{ key: "manual", label: "H-pattern manual" }, { key: "other", label: "Other −0.5" }]} value={trans} onChange={setTrans} />
              </Field>
            </div>
          </div>

          <div style={{ background: "#F2F5F7", borderRadius: 8, padding: "16px", marginTop: 4 }}>
            <div style={{ display: "flex", gap: 18, flexWrap: "wrap", marginBottom: 18 }}>
              <Stat label="Base ratio (W÷PM)" value={isFinite(baseRatio) ? r2(baseRatio) : "—"} />
              <Stat label="Modifiers" value={(totalMod >= 0 ? "+" : "") + totalMod} />
              <Stat label="PWR ratio" value={isFinite(finalRatio) ? r2(finalRatio) : "—"} big />
              <Stat label="Class" value={cls ? cls.name : "—"} big color={cls ? cls.hue : T.ink} />
            </div>
            <ClassBand ratio={finalRatio} />
            {cls && cls.note && <div style={{ ...sans, fontSize: 12.5, color: T.warn, fontWeight: 600, marginTop: 26 }}>{cls.note}</div>}
            <div style={{ ...mono, fontSize: 13, color: T.ink, marginTop: 18, paddingTop: 12, borderTop: `1px solid ${T.line}` }}>
              <span style={{ ...sans, fontSize: 11, textTransform: "uppercase", letterSpacing: ".05em", color: T.mut, marginRight: 8 }}>WATT display</span>{watt}
            </div>
          </div>

          {/* V5.1 vs V5.2 compare panel */}
          <div style={{ marginTop: 20, paddingTop: 16, borderTop: `1px solid ${T.line}` }}>
            <div style={{ ...sans, fontSize: 13, fontWeight: 700, color: T.ink, marginBottom: 2 }}>V5.1 vs V5.2 — side by side</div>
            <div style={{ ...sans, fontSize: 11.5, color: T.mut, marginBottom: 8 }}>Click a row to make it the active ruleset above. Same weight + modifiers; only the PM method differs.</div>
            <div style={{ border: `1px solid ${T.line}`, borderRadius: 8, overflow: "hidden" }}>
              <div style={{ display: "grid", gridTemplateColumns: "72px 1fr 1fr 1fr", background: "#F2F5F7", borderBottom: `1px solid ${T.line}` }}>
                {["Ruleset", "PM", "Ratio", "Class"].map((h) => (
                  <div key={h} style={{ ...sans, fontSize: 10.5, fontWeight: 700, color: T.mut, textTransform: "uppercase", letterSpacing: ".04em", padding: "7px 10px" }}>{h}</div>
                ))}
              </div>
              <div style={{ borderBottom: `1px solid ${T.line}` }}>
                <CompareRow version="V5.1" active={rulesVersion === "v51"} onPick={() => setRulesVersion("v51")} pm={pmForClass_v51} ratio={ratio_v51} cls={cls_v51} />
              </div>
              <CompareRow version="V5.2" active={rulesVersion === "v52"} onPick={() => setRulesVersion("v52")} pm={pmForClass_v52} ratio={ratio_v52} cls={cls_v52} />
            </div>
            {cls_v51 && cls_v52 && cls_v51.name !== cls_v52.name && (
              <div style={{ ...sans, fontSize: 12, color: T.warn, fontWeight: 600, marginTop: 8 }}>
                The rule change moves this car {cls_v51.name} → {cls_v52.name}.
              </div>
            )}
            {trans !== "other" && (
              <div style={{ ...sans, fontSize: 11, color: T.mut, marginTop: 6 }}>
                Manual-transmission PM method is unchanged in V5.2 — any difference above comes only from the ×1.10 Mustang factor or a Declared PM you've already entered.
              </div>
            )}
          </div>
        </Card>

        {/* ── §3 Build solver ───────────────────────────────────── */}
        <Card n="3" title="Build solver" sub="Invert the math: what weight / PM lands you in each class. Uses PM, weight, and modifiers from §1–2.">
          {stay ? (
            <div style={{ borderRadius: 8, padding: "14px 16px", marginBottom: 16, background: `${stay.hue}14`, border: `1px solid ${stay.hue}55` }}>
              <div style={{ ...sans, fontSize: 12, color: T.mut, marginBottom: 4 }}>To stay <b style={{ color: stay.hue }}>{stay.cls}</b> at your current modifiers ({(totalMod >= 0 ? "+" : "") + totalMod}):</div>
              <div style={{ ...mono, fontSize: 14, color: T.ink, lineHeight: 1.7 }}>
                weight <b>{stay.wlo} – {stay.whi}</b> lb&nbsp; (at PM {r1(pmForClass)})<br />
                PM <b>{stay.plo} – {stay.phi}</b>&nbsp; (at {lbs(w)} lb)
              </div>
            </div>
          ) : (
            <div style={{ ...sans, fontSize: 12.5, color: T.mut, marginBottom: 16 }}>Enter a PM (§1 or §2) and a weight (§2) to see stay-in-class ranges. Tables below fill as soon as one side is known.</div>
          )}

          <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 300px" }}>
              <div style={{ ...sans, fontSize: 12, fontWeight: 700, color: T.ink, marginBottom: 6 }}>Weight window per class <span style={{ color: T.mut, fontWeight: 400 }}>· at PM {havePM ? r1(pmForClass) : "—"}</span></div>
              <WindowTable head={["Class", "Min lb", "Max lb"]} rows={wRows} currentName={cls ? cls.name : null} />
            </div>
            <div style={{ flex: "1 1 300px" }}>
              <div style={{ ...sans, fontSize: 12, fontWeight: 700, color: T.ink, marginBottom: 6 }}>PM window per class <span style={{ color: T.mut, fontWeight: 400 }}>· at {haveW ? lbs(w) : "—"} lb</span></div>
              <WindowTable head={["Class", "Min PM", "Max PM"]} rows={pRows} currentName={cls ? cls.name : null} />
            </div>
          </div>
          <div style={{ ...sans, fontSize: 11, color: T.mut, marginTop: 10, lineHeight: 1.5 }}>
            Higher PM (more power) or lower weight pushes you toward a faster class (lower number). Boundaries are shared — a car exactly on the line falls in the higher-numbered class. Toggle tires/aero/trans in §2 to see the windows shift.
          </div>

          {/* target-class gap */}
          <div style={{ marginTop: 20, paddingTop: 16, borderTop: `1px solid ${T.line}` }}>
            <div style={{ ...sans, fontSize: 13, fontWeight: 700, color: T.ink, marginBottom: 8 }}>What do I change to run a target class?</div>
            <Field label="Target class">
              <Seg options={BANDS.map((b) => ({ key: b.name, label: b.name }))} value={targetClass} onChange={setTargetClass} />
            </Field>

            {(!havePM || !haveW) ? (
              <div style={{ ...sans, fontSize: 12.5, color: T.mut }}>Enter a PM (§1 or §2) and a weight (§2) to see the adjustment needed.</div>
            ) : (
              <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                <GapTile kind="weight" gap={wGap} band={targetBand} pm={pmForClass} w={w} mods={totalMod} />
                <GapTile kind="pm" gap={pGap} band={targetBand} pm={pmForClass} w={w} mods={totalMod} />
              </div>
            )}
            <div style={{ ...sans, fontSize: 11, color: T.mut, marginTop: 10, lineHeight: 1.5 }}>
              Each tile is a single-variable move to just meet the {targetClass} limit: change weight <i>or</i> change power, holding the other constant.
            </div>
          </div>
        </Card>

        {/* ── §4 Impound ────────────────────────────────────────── */}
        <Card n="4" title="Impound compliance check" sub="Recompute with actual weighed weight + max measured PM; round to nearest tenth">
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 140px" }}><Field label="Impound weight (lbs)"><NumIn value={impW} onChange={setImpW} placeholder="2726" /></Field></div>
            <div style={{ flex: "1 1 140px" }}><Field label="Max impound PM"><NumIn value={impPM} onChange={setImpPM} placeholder="212" /></Field></div>
          </div>
          <div style={{ ...sans, fontSize: 12, color: T.mut, marginBottom: 12 }}>Uses the same modifiers ({(totalMod >= 0 ? "+" : "") + totalMod}) and your declared class floor from §2.</div>

          <div style={{ borderRadius: 8, padding: "16px", background: impPass === null ? "#F2F5F7" : impPass ? "#EAF5EE" : "#FBEBE9", border: `1px solid ${impPass === null ? T.line : impPass ? T.pass : T.fail}` }}>
            <div style={{ display: "flex", gap: 18, flexWrap: "wrap", alignItems: "center" }}>
              <Stat label="Impound ratio (rounded)" value={isFinite(impRatio) ? impRatio.toFixed(1) : "—"} big />
              <Stat label={cls && cls.floor ? `${cls.name} floor` : "Class floor"} value={declFloor !== null ? declFloor.toFixed(1) : "—"} />
              <div style={{ flex: 1, minWidth: 120, textAlign: "right" }}>
                {impPass !== null && <span style={{ ...sans, fontSize: 20, fontWeight: 800, color: impPass ? T.pass : T.fail }}>{impPass ? "✓ PASS" : "✗ DQ"}</span>}
              </div>
            </div>
            {impPass === false && (
              <div style={{ ...sans, fontSize: 12.5, color: T.fail, marginTop: 10 }}>
                Below the {cls.name} minimum — measured PM came in high relative to weight. Add ballast to reach ratio {declFloor.toFixed(1)}.
              </div>
            )}
            {impPass === true && (
              <div style={{ ...sans, fontSize: 12.5, color: T.pass, marginTop: 10 }}>
                Clears the {cls.name} floor with {(impRatio - declFloor).toFixed(1)} to spare.
              </div>
            )}
          </div>
        </Card>

        <footer style={{ ...sans, fontSize: 11.5, color: T.mut, lineHeight: 1.5, marginTop: 4 }}>
          Bands: PWR5 [6–9) · PWR4 [9–11) · PWR3 [11–14) · PWR2 [14–17) · PWR1 [17+]. Modifiers stack; a higher-performance declaration lets you run a lower-performance item without re-classing. Reproduces the published PWR V5.1 and V5.2 math for planning — the V5.2 Sequential/Automatic PM method (best 4-of-7 window) is this tool's estimate of a calculation the rules committee performs manually through 2026. The approved Jotform disclosure remains the compliance record.
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PWRCalculator/>);
</script></body></html>
